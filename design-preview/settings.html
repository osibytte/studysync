<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification settings · StudySync preview</title>
<link rel="stylesheet" href="theme.css">
<style>
  .toggle { display: flex; align-items: center; gap: 12px; }
  .toggle .rl-main b { font-size: 15px; font-weight: 700; display: block; }
  .toggle .rl-main span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .subToggle { margin-top: 10px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span style="display:flex; align-items:center">
        <span class="sig"><i></i><i></i><i></i></span>
        <span class="batt"></span>
      </span>
    </div>
    <div class="screen">
      <div class="content">
        <div class="pagehead">
          <a class="circle-btn" href="profile.html" aria-label="Back">
            <svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </a>
          <h1>Notifications</h1>
        </div>

        <div class="section-h"><h3>Push</h3></div>
        <div class="card toggle">
          <div class="rl-main">
            <b>Push notifications</b>
            <span>Sent to this phone</span>
          </div>
          <span class="switch"><i></i></span>
        </div>

        <div class="section-h"><h3>What to notify me about</h3></div>
        <div class="card toggle">
          <div class="rl-main"><b>New messages</b></div>
          <span class="switch"><i></i></span>
        </div>
        <div class="card toggle subToggle">
          <div class="rl-main">
            <b>Quiet hours</b>
            <span>Mute everything between these times</span>
          </div>
          <span class="switch off"><i></i></span>
        </div>
        <div class="card toggle">
          <div class="rl-main"><b>Invitations and replies</b></div>
          <span class="switch"><i></i></span>
        </div>
        <div class="card toggle">
          <div class="rl-main"><b>Session reminders</b></div>
          <span class="switch"><i></i></span>
        </div>

        <div class="section-h"><h3>Per day</h3></div>
        <div class="chiprow">
          <span class="chip">5</span>
          <span class="chip selected">10</span>
          <span class="chip">20</span>
          <span class="chip">No limit</span>
        </div>
      </div>

      <div class="tabbar">
        <a class="tab" href="home.html">
          <svg class="ic" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Home
        </a>
        <a class="tab" href="groups.html">
          <svg class="ic" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Groups
        </a>
        <a class="tab" href="notifications.html">
          <svg class="ic" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          Inbox
        </a>
        <a class="tab active" href="profile.html">
          <svg class="ic" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Profile
        </a>
      </div>
    </div>
  </div>
  <p class="caption">Notification settings.</p>
</body>
</html>
