<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account · StudySync preview</title>
<link rel="stylesheet" href="theme.css">
<style>
  .auth {
    flex: 1;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .auth .logo-tile { width: 62px; height: 62px; border-radius: 20px; }
  .auth h1 { font-size: 27px; font-weight: 700; margin-top: 22px; }
  .auth .lead { color: var(--muted); font-size: 15px; font-weight: 500; margin-top: 4px; }
  .auth .btn { margin-top: 26px; }
  .auth .alt { text-align: center; margin-top: 14px; }
  .auth .alt a { color: var(--primary-dark); font-weight: 700; font-size: 14px; text-decoration: none; }
  .pair { display: flex; gap: 10px; }
  .pair > div { flex: 1; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span style="display:flex; align-items:center">
        <span class="sig"><i></i><i></i><i></i></span>
        <span class="batt"></span>
      </span>
    </div>
    <div class="screen">
      <div class="auth">
        <div class="logo-tile">
          <svg class="ic" style="width:30px; height:30px" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </div>
        <h1>Create account</h1>
        <p class="lead">Use your school email.</p>

        <div class="fieldwrap">
          <label class="flabel">Full name</label>
          <div class="field">Ada Dimoko</div>
        </div>
        <div class="fieldwrap">
          <label class="flabel">Department</label>
          <div class="field">e.g. Computer Science</div>
        </div>
        <div class="fieldwrap">
          <label class="flabel">Email</label>
          <div class="field">ada.dimoko@ui.edu.ng</div>
        </div>
        <div class="fieldwrap">
          <label class="flabel">Password</label>
          <div class="field">••••••••••</div>
        </div>

        <button class="btn block">Create account</button>
        <p class="alt">Have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>
  <p class="caption">Create account. After this you get a verify-your-email notice.</p>
</body>
</html>
