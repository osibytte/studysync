<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account · StudySync preview</title>
<link rel="stylesheet" href="theme.css">
<style>
  .band { padding-bottom: 56px; }
  .hero { padding: 36px 24px 0; }
  .hero .mark { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; }
  .hero h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.12; margin-top: 22px; }
  .hero p { font-size: 15px; color: rgba(255,255,255,0.78); margin-top: 8px; line-height: 1.5; }
  .sheet { padding: 12px 20px 40px; }
  .alt { text-align: center; margin-top: 18px; font-size: 14px; color: var(--text-2); }
  .alt a { color: var(--text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="band">
        <div class="statusbar light"></div>
        <div class="hero">
          <span class="mark"><i data-icon="logo" class="lg"></i></span>
          <h1>Find people to study with</h1>
          <p>Matched by course and the hours you're free.</p>
        </div>
      </div>
      <div class="sheet">
        <div class="fieldwrap">
          <label class="flabel">Full name</label>
          <div class="field ">Ada Dimoko</div>
        </div>
        <div class="fieldwrap">
          <label class="flabel">Department</label>
          <div class="field ph">e.g. Computer Science</div>
        </div>
        <div class="fieldwrap">
          <label class="flabel">School email</label>
          <div class="field ">ada.dimoko@ui.edu.ng</div>
        </div>
        <div class="fieldwrap">
          <label class="flabel">Password</label>
          <div class="field ph">At least 6 characters</div>
        </div>

        <button class="btn block" style="margin-top:24px">Create account<i data-icon="arrow" class="sm"></i></button>
        <p class="alt">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>
  <p class="caption">Create account. If email confirmation is on, a check-your-inbox notice follows.</p>
  <script src="chrome.js"></script>
</body>
</html>
